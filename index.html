<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meyzenworks</title>
<meta name="description" content="Meyzenworks makes small, calm, well-made apps and puzzle games.">
<link rel="icon" href="images/pipes-icon.png" type="image/png">
<style>
  :root { --primary:#6750A4; --surface:#FEF7FF; --on:#1D1B20; --muted:#49454F; --card:#F3EDF7; }
  @media (prefers-color-scheme: dark) { :root { --primary:#D0BCFF; --surface:#141218; --on:#E6E0E9; --muted:#CAC4D0; --card:#211F26; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; background:var(--surface); color:var(--on); }
  main { max-width: 720px; margin: 0 auto; padding: 56px 24px 40px; }
  h1 { font-size: 40px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.5px; }
  .tag { color: var(--muted); font-size: 18px; margin: 0 0 40px; }
  h2 { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
  a.app { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 20px; background: var(--card); color: inherit; text-decoration: none; }
  a.app:hover { outline: 2px solid var(--primary); }
  a.app img { width: 64px; height: 64px; border-radius: 16px; }
  .app b { display: block; font-size: 18px; font-weight: 500; }
  .app span { color: var(--muted); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; line-height: 1.8; }
  footer a { color: var(--primary); }
</style>
</head>
<body>
<main>
  <h1>Meyzenworks</h1>
  <p class="tag">Small, calm, well-made apps.</p>
  <h2>Apps</h2>
  <a class="app" href="pipes/">
    <img src="images/pipes-icon.png" alt="">
    <div><b>Pipes</b><span>Connect matching dots and fill every square. Daily puzzles, bridges and portals. Works offline.</span></div>
  </a>
  <footer>
    Contact: <a href="mailto:meyzenworks@gmail.com">meyzenworks@gmail.com</a><br>
    <a href="pipes/privacy.html">Pipes privacy policy</a>
  </footer>
</main>
</body>
</html>
